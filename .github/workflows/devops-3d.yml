name: Generate 3D Isometric DevOps Network

on:
  schedule:
    # Chạy mỗi 12 tiếng một lần (00:00 và 12:00 UTC)
    - cron: '0 */12 * * *'
  push:
    branches:
      - main
    paths:
      - 'generate_devops_3d.py'
      - '.github/workflows/devops-3d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Isometric 3D SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python generate_devops_3d.py

      - name: Commit & Push to Main
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dist/devops-3d-network.svg
          if git commit -m "chore(auto): update 3D DevOps network graph [skip ci]"; then
            git pull --rebase origin main
            git push
          fi
