name: Generate Mario Contribution Graph

on:
  schedule:
    # Runs daily at midnight UTC (and every 12 hours)
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_mario.py"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Mario Contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: |
          python generate_mario.py

      - name: Push SVG to Main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mario_contribution.svg
          if git commit -m "🍄 [1-UP]: Mario completed contribution parkour [skip ci]"; then
            git pull --rebase origin main
            git push
          fi
