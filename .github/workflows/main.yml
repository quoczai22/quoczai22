name: Sync DevOps 3D Network Telemetry

on:
  schedule:
    # Tự động đồng bộ mỗi 12 tiếng một lần
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_devops_3d.py"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    name: sync-telemetry
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate DevOps 3D Isometric Network
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python generate_devops_3d.py

      - name: Commit & Push Telemetry to Main
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dist/devops-3d-network.svg
          if git commit -m "📡 [Mesh Telemetry]: Synced packet telemetry & 3D cluster topology [skip ci]"; then
            git pull --rebase origin main
            git push
          fi
