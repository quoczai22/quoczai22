name: Sync Mario Commits Adventure

on:
  schedule:
    # Tự động cập nhật mỗi 12 tiếng một lần
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "generate_mario_commits.py"
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    name: sync-mario-stage
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Mario Commits SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python generate_mario_commits.py

      - name: Commit & Push Mario Adventure to Main
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dist/mario-commits.svg
          if git commit -m "🍄 [1-UP]: Mario collected new commits & coins [skip ci]"; then
            git pull --rebase origin main
            git push
          fi
